<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>I'm Titi — Attempt Comparison</title>
<meta name="theme-color" content="#0c0f14"/>
<link rel="manifest" href="manifest.webmanifest"/>
<style>
  :root{
    --bg:#0c0f14; --panel:#141923; --panel-2:#1b2230; --line:#283142;
    --ink:#e9eef7; --ink-dim:#9aa7bd; --ink-faint:#61708a;
    --accent:#b7ff3f;        /* pane A — chalk lime */
    --accent-b:#3fd6ff;      /* pane B — glacier cyan */
    --bad:#ff5d6c;
    --radius:14px;
    font-synthesis:none;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{
    font:inherit; color:var(--ink); background:var(--panel-2);
    border:1px solid var(--line); border-radius:10px; padding:10px 14px;
    cursor:pointer; touch-action:manipulation;
  }
  button:active{transform:translateY(1px)}
  button.primary{background:var(--accent); color:#0c0f14; font-weight:700; border-color:transparent}
  button[aria-pressed="true"]{outline:2px solid var(--accent); outline-offset:-1px}
  button:disabled{opacity:.45; cursor:default}
  .hidden{display:none!important}

  header.top{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:10px 14px 8px; border-bottom:1px solid var(--line); height:52px;
  }
  header.top h1{font-size:20px; letter-spacing:.14em}
  header.top .tag{font-size:13px; color:var(--ink-dim)}
  header.top .privacy{font-size:13px; color:var(--ink-faint)}

  .stage{
    display:grid; gap:8px; padding:8px;
    grid-template-rows:1fr auto 1fr;
    height:calc(100dvh - 52px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  }
  @media (orientation: landscape){
    .stage{
      grid-template-columns:1fr 1fr; grid-template-rows:1fr auto;
    }
    .pane[data-pane="A"]{grid-column:1; grid-row:1}
    .pane[data-pane="B"]{grid-column:2; grid-row:1}
    .transport{grid-column:1 / 3; grid-row:2}
  }

  .pane{display:flex; flex-direction:column; gap:6px; min-height:0}
  .viewport{
    position:relative; flex:1; min-height:0; border-radius:var(--radius);
    background:#05070a; border:1px solid var(--line); overflow:hidden;
  }
  .viewport video{width:100%; height:100%; object-fit:contain; display:block}
  .viewport .overlay{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .viewport .label{
    position:absolute; top:8px; left:8px; z-index:2;
    font-size:13px; font-weight:800; letter-spacing:.08em;
    padding:2px 8px; border-radius:6px; background:rgba(0,0,0,.55);
  }
  .pane[data-pane="A"] .label{color:var(--accent)}
  .pane[data-pane="B"] .label{color:var(--accent-b)}
  .empty{
    position:absolute; inset:0; display:grid; place-content:center; gap:10px;
    text-align:center; background:var(--panel);
  }
  .empty .hint{font-size:13px; color:var(--ink-faint)}
  .pane-error{
    position:absolute; left:8px; right:8px; bottom:8px; z-index:3;
    background:rgba(20,8,10,.92); border:1px solid var(--bad); color:var(--ink);
    border-radius:10px; padding:8px 12px; font-size:13px;
  }
  .setup,.pane-bar{
    display:flex; align-items:center; gap:8px; flex:none;
  }
  .setup .solo-scrub{flex:1}
  .sync-chip{font-size:13px; color:var(--ink-dim); padding:0 4px}
  .pane-bar button{padding:8px 10px}

  .transport{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 12px; flex:none;
  }
  .transport-hint{font-size:13px; color:var(--ink-dim); text-align:center}
  .controls{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
  .controls #playPause{min-width:84px}
  .speeds,.steps{display:flex; gap:4px}
  .speeds button.on{outline:2px solid var(--accent); outline-offset:-1px}
  #masterScrub{flex:1 1 100%; margin-top:4px}
  input[type="range"]{accent-color:var(--accent); height:28px}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>I'M TITI</h1>
    <p class="tag">only 1 way to test it</p>
  </div>
  <p class="privacy">Videos never leave this device</p>
</header>

<main class="stage">
  <section class="pane" data-pane="A">
    <div class="viewport">
      <video playsinline muted preload="auto"></video>
      <canvas class="overlay"></canvas>
      <span class="label">ATTEMPT A</span>
      <div class="empty">
        <button class="pick primary">Load Attempt A</button>
        <p class="hint">Pick a video from your camera roll</p>
      </div>
      <div class="pane-error hidden"></div>
    </div>
    <div class="setup hidden">
      <input type="range" class="solo-scrub" min="0" max="1000" value="0" step="1"/>
      <button class="set-sync primary">Set sync point</button>
    </div>
    <div class="pane-bar hidden">
      <span class="sync-chip">Synced</span>
      <button class="adjust-sync">Adjust sync</button>
      <button class="skel" aria-pressed="false">Skeleton</button>
      <button class="replace">Replace</button>
    </div>
    <input type="file" accept="video/*" class="file" hidden/>
  </section>

  <section class="transport" id="transport">
    <p class="transport-hint" id="transportHint">Load both attempts, then in each video scrub to the same moment (like hands on the start holds) and set the sync point.</p>
    <div class="controls hidden" id="controls">
      <button id="playPause" class="primary">Play</button>
      <div class="speeds">
        <button data-speed="1" class="on">1x</button>
        <button data-speed="0.5">1/2x</button>
        <button data-speed="0.25">1/4x</button>
      </div>
      <div class="steps">
        <button id="stepBack">-1 frame</button>
        <button id="stepFwd">+1 frame</button>
      </div>
      <input type="range" id="masterScrub" min="0" max="1000" value="0" step="1"/>
    </div>
  </section>

  <section class="pane" data-pane="B">
    <div class="viewport">
      <video playsinline muted preload="auto"></video>
      <canvas class="overlay"></canvas>
      <span class="label">ATTEMPT B</span>
      <div class="empty">
        <button class="pick primary">Load Attempt B</button>
        <p class="hint">Pick a video from your camera roll</p>
      </div>
      <div class="pane-error hidden"></div>
    </div>
    <div class="setup hidden">
      <input type="range" class="solo-scrub" min="0" max="1000" value="0" step="1"/>
      <button class="set-sync primary">Set sync point</button>
    </div>
    <div class="pane-bar hidden">
      <span class="sync-chip">Synced</span>
      <button class="adjust-sync">Adjust sync</button>
      <button class="skel" aria-pressed="false">Skeleton</button>
      <button class="replace">Replace</button>
    </div>
    <input type="file" accept="video/*" class="file" hidden/>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
